<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="navyGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0074D9;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#00A8E8;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#00FF87;stop-opacity:1" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="4" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Cercle de fond avec dégradé -->
  <circle cx="256" cy="256" r="240" fill="url(#navyGradient)" opacity="0.95" filter="url(#glow)"/>
  
  <!-- Lettre N stylisée -->
  <path d="M 160 150 L 160 360 L 200 360 L 200 220 L 310 360 L 350 360 L 350 150 L 310 150 L 310 290 L 200 150 Z" 
        fill="white" 
        stroke="white" 
        stroke-width="2"/>
  
  <!-- Effet de brillance -->
  <ellipse cx="200" cy="180" rx="60" ry="40" fill="white" opacity="0.2"/>
</svg>