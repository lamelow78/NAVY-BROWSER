<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NAVY Browser</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body data-theme="dark">
  <!-- Barre de navigation -->
  <div class="navbar">
    <div class="nav-controls">
      <button id="back-btn" class="nav-btn" title="Retour">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M19 12H5M12 19l-7-7 7-7"/>
        </svg>
      </button>
      
      <button id="forward-btn" class="nav-btn" title="Suivant">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M5 12h14M12 5l7 7-7 7"/>
        </svg>
      </button>
      
      <button id="reload-btn" class="nav-btn" title="Actualiser">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M21.5 2v6h-6M2.5 22v-6h6M2 11.5a10 10 0 0118.8-4.3M22 12.5a10 10 0 01-18.8 4.2"/>
        </svg>
      </button>
      
      <button id="home-btn" class="nav-btn" title="Accueil">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M3 9l9-7 9 7v11a2 2 0 01-2 2H5a2 2 0 01-2-2z"/>
          <polyline points="9 22 9 12 15 12 15 22"/>
        </svg>
      </button>
    </div>

    <!-- Barre d'adresse -->
    <div class="url-bar">
      <div class="security-indicator" id="security-lock">🔒</div>
      <input 
        type="text" 
        id="url-input" 
        placeholder="Rechercher sur Google ou entrer une URL..."
        autocomplete="off"
      />
      <button id="bookmark-add-btn" class="icon-btn" title="Ajouter aux favoris">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M19 21l-7-5-7 5V5a2 2 0 012-2h10a2 2 0 012 2z"/>
        </svg>
      </button>
    </div>

    <!-- Boutons droite -->
    <div class="nav-right">
      <div class="shields-button" id="shields-btn" title="NAVY Shields">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
          <path d="M12 1L3 5v6c0 5.55 3.84 10.74 9 12 5.16-1.26 9-6.45 9-12V5l-9-4z"/>
        </svg>
        <span id="blocked-count">0</span>
      </div>

      <button id="passwords-btn" class="nav-btn" title="Mots de passe">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
          <path d="M7 11V7a5 5 0 0110 0v4"/>
        </svg>
      </button>

      <button id="settings-btn" class="nav-btn" title="Paramètres">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="12" cy="12" r="3"/>
          <path d="M12 1v6m0 6v6M4.22 4.22l4.24 4.24m7.08 7.08l4.24 4.24M1 12h6m6 0h6M4.22 19.78l4.24-4.24m7.08-7.08l4.24-4.24"/>
        </svg>
      </button>
    </div>
  </div>

  <!-- Barre de favoris -->
  <div class="bookmarks-bar" id="bookmarks-bar">
    <div class="bookmarks-container" id="bookmarks-container">
      <!-- Les favoris seront ajoutés ici dynamiquement -->
    </div>
  </div>

  <!-- Webview -->
  <webview id="browser-view" src="https://www.google.fr" allowpopups></webview>

  <!-- Panneau Shields -->
  <div class="shields-panel" id="shields-panel">
    <h3>🛡️ NAVY Shields</h3>
    <div class="shield-stats">
      <div class="stat-item">
        <span class="stat-number" id="total-blocked">0</span>
        <span class="stat-label">Pubs bloquées</span>
      </div>
      <div class="stat-item">
        <span class="stat-number" id="trackers-blocked">0</span>
        <span class="stat-label">Trackers</span>
      </div>
      <div class="stat-item">
        <span class="stat-number">98%</span>
        <span class="stat-label">Protection</span>
      </div>
    </div>
    <p class="shield-info">Mode: <strong>Ultra-Agressif</strong></p>
  </div>

  <!-- Panneau Mots de passe -->
  <div class="password-panel" id="password-panel">
    <h3>🔐 Mots de passe sauvegardés</h3>
    <div id="password-list" class="password-list">
      <!-- Les mots de passe seront listés ici -->
    </div>
  </div>

  <!-- Popup sauvegarde mot de passe -->
  <div class="password-save-popup" id="password-save-popup">
    <div class="popup-content">
      <h4>💾 Sauvegarder le mot de passe ?</h4>
      <p>Voulez-vous enregistrer ce mot de passe dans NAVY ?</p>
      <div class="popup-info">
        <strong>Site :</strong> <span id="popup-site">example.com</span><br>
        <strong>Identifiant :</strong> <span id="popup-username">user@example.com</span>
      </div>
      <div class="popup-buttons">
        <button id="save-password-btn" class="btn-primary">Enregistrer</button>
        <button id="cancel-password-btn" class="btn-secondary">Non merci</button>
      </div>
    </div>
  </div>

  <script src="renderer.js"></script>
</body>
</html>
