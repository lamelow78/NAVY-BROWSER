<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NAVY Browser - Télécharger</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: linear-gradient(135deg, #000814 0%, #001F3F 100%);
      color: white;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .container {
      text-align: center;
      max-width: 800px;
    }

    .logo {
      width: 120px;
      height: 120px;
      margin-bottom: 30px;
      animation: float 3s ease-in-out infinite;
    }

    @keyframes float {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-15px); }
    }

    h1 {
      font-size: 56px;
      margin-bottom: 16px;
      background: linear-gradient(135deg, #0074D9, #00A8E8, #00FF87);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .subtitle {
      font-size: 20px;
      color: #B0BEC5;
      margin-bottom: 50px;
    }

    .download-buttons {
      display: flex;
      gap: 20px;
      justify-content: center;
      flex-wrap: wrap;
      margin-bottom: 40px;
    }

    .download-btn {
      background: linear-gradient(135deg, #0074D9, #00A8E8, #00FF87);
      color: white;
      text-decoration: none;
      padding: 18px 35px;
      border-radius: 12px;
      font-size: 18px;
      font-weight: bold;
      display: flex;
      align-items: center;
      gap: 12px;
      transition: all 0.3s ease;
      box-shadow: 0 4px 20px rgba(0, 168, 232, 0.3);
      min-width: 180px;
      justify-content: center;
    }

    .download-btn:hover {
      transform: translateY(-3px);
      box-shadow: 0 6px 30px rgba(0, 168, 232, 0.5);
    }

    .download-btn svg {
      width: 24px;
      height: 24px;
    }

    .recommended {
      position: relative;
    }

    .recommended::after {
      content: 'Recommandé';
      position: absolute;
      top: -8px;
      right: -8px;
      background: #00FF87;
      color: #000814;
      padding: 2px 8px;
      border-radius: 8px;
      font-size: 11px;
      font-weight: bold;
    }

    .features {
      display: flex;
      gap: 30px;
      justify-content: center;
      margin-top: 50px;
    }

    .feature {
      text-align: center;
    }

    .feature-icon {
      font-size: 36px;
      margin-bottom: 8px;
    }

    .feature-text {
      font-size: 14px;
      color: #B0BEC5;
    }

    .github-link {
      margin-top: 30px;
      color: #7FDBFF;
      text-decoration: none;
      font-size: 14px;
    }

    .github-link:hover {
      text-decoration: underline;
    }

    @media (max-width: 768px) {
      h1 { font-size: 36px; }
      .download-buttons { flex-direction: column; align-items: center; }
      .features { flex-direction: column; gap: 20px; }
    }
  </style>
</head>
<body>
  <div class="container">
    <svg class="logo" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <linearGradient id="g" x1="0%" y1="0%" x2="100%" y2="100%">
          <stop offset="0%" style="stop-color:#0074D9"/>
          <stop offset="50%" style="stop-color:#00A8E8"/>
          <stop offset="100%" style="stop-color:#00FF87"/>
        </linearGradient>
      </defs>
      <circle cx="256" cy="256" r="240" fill="url(#g)" opacity="0.95"/>
      <path d="M 160 150 L 160 360 L 200 360 L 200 220 L 310 360 L 350 360 L 350 150 L 310 150 L 310 290 L 200 150 Z" fill="white"/>
    </svg>

    <h1>NAVY Browser</h1>
    <p class="subtitle">Le navigateur qui bloque 98% des pubs<br>Installation en 1 clic ⚡</p>

    <div class="download-buttons">
      <a href="https://github.com/lamelow78/NAVY-BROWSER/releases/latest/download/NAVY-Setup.exe" class="download-btn" id="windows-btn">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <rect x="3" y="3" width="18" height="18" rx="2"/>
          <line x1="9" y1="9" x2="15" y2="15"/>
          <line x1="15" y1="9" x2="9" y2="15"/>
        </svg>
        Windows
      </a>

      <a href="https://github.com/lamelow78/NAVY-BROWSER/releases/latest/download/NAVY.dmg" class="download-btn" id="mac-btn">
        <svg viewBox="0 0 24 24" fill="currentColor">
          <path d="M18.71 19.5C17.88 20.74 17 21.95 15.66 21.97C14.32 22 13.89 21.18 12.37 21.18C10.84 21.18 10.37 21.95 9.1 22C7.79 22.05 6.8 20.68 5.96 19.47C4.25 17 2.94 12.45 4.7 9.39C5.57 7.87 7.13 6.91 8.82 6.88C10.1 6.86 11.32 7.75 12.11 7.75C12.89 7.75 14.37 6.68 15.92 6.84C16.57 6.87 18.39 7.1 19.56 8.82C19.47 8.88 17.39 10.1 17.41 12.63C17.44 15.65 20.06 16.66 20.09 16.67C20.06 16.74 19.67 18.11 18.71 19.5M13 3.5C13.73 2.67 14.94 2.04 15.94 2C16.07 3.17 15.6 4.35 14.9 5.19C14.21 6.04 13.07 6.7 11.95 6.61C11.8 5.46 12.36 4.26 13 3.5Z"/>
        </svg>
        macOS
      </a>

      <a href="https://github.com/lamelow78/NAVY-BROWSER/releases/latest/download/NAVY.AppImage" class="download-btn" id="linux-btn">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="12" cy="12" r="10"/>
          <polyline points="12 6 12 12 16 14"/>
        </svg>
        Linux
      </a>
    </div>

    <div class="features">
      <div class="feature">
        <div class="feature-icon">🛡️</div>
        <div class="feature-text">Bloqueur Ultra-Puissant</div>
      </div>
      <div class="feature">
        <div class="feature-icon">🔐</div>
        <div class="feature-text">Mots de passe intégrés</div>
      </div>
      <div class="feature">
        <div class="feature-icon">⚡</div>
        <div class="feature-text">Mode Optimisation</div>
      </div>
    </div>

    <a href="https://github.com/lamelow78/NAVY-BROWSER" class="github-link">
      Code source sur GitHub →
    </a>
  </div>

  <script>
    function detectOS() {
      const platform = navigator.platform.toLowerCase();
      const userAgent = navigator.userAgent.toLowerCase();
      
      if (platform.includes('win') || userAgent.includes('windows')) return 'windows';
      if (platform.includes('mac') || userAgent.includes('mac')) return 'mac';
      if (platform.includes('linux') || userAgent.includes('linux')) return 'linux';
      
      return 'windows';
    }

    const os = detectOS();
    const btn = document.getElementById(os + '-btn');
    if (btn) {
      btn.classList.add('recommended');
    }
  </script>
</body>
</html>
