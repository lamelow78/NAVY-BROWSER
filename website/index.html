<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NAVY Browser - Télécharger</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: linear-gradient(135deg, #000814 0%, #001F3F 100%);
      color: white;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .container {
      text-align: center;
      max-width: 600px;
    }

    .logo {
      width: 150px;
      height: 150px;
      margin-bottom: 30px;
      animation: float 3s ease-in-out infinite;
    }

    @keyframes float {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-20px); }
    }

    h1 {
      font-size: 48px;
      margin-bottom: 20px;
      background: linear-gradient(135deg, #0074D9, #00A8E8, #00FF87);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    p {
      font-size: 20px;
      color: #B0BEC5;
      margin-bottom: 40px;
    }

    .download-btn {
      display: inline-block;
      background: linear-gradient(135deg, #0074D9, #00A8E8, #00FF87);
      color: white;
      text-decoration: none;
      padding: 20px 50px;
      border-radius: 50px;
      font-size: 24px;
      font-weight: bold;
      box-shadow: 0 10px 40px rgba(0, 168, 232, 0.5);
      transition: all 0.3s ease;
    }

    .download-btn:hover {
      transform: translateY(-5px);
      box-shadow: 0 15px 60px rgba(0, 168, 232, 0.7);
    }

    .os-name {
      font-size: 16px;
      color: #7FDBFF;
      margin-top: 20px;
    }

    .features {
      margin-top: 60px;
      display: flex;
      gap: 30px;
      justify-content: center;
    }

    .feature {
      text-align: center;
    }

    .feature-icon {
      font-size: 40px;
      margin-bottom: 10px;
    }

    .feature-text {
      font-size: 14px;
      color: #B0BEC5;
    }
  </style>
</head>
<body>
  <div class="container">
    <svg class="logo" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <linearGradient id="g" x1="0%" y1="0%" x2="100%" y2="100%">
          <stop offset="0%" style="stop-color:#0074D9"/>
          <stop offset="50%" style="stop-color:#00A8E8"/>
          <stop offset="100%" style="stop-color:#00FF87"/>
        </linearGradient>
      </defs>
      <circle cx="256" cy="256" r="240" fill="url(#g)"/>
      <path d="M 160 150 L 160 360 L 200 360 L 200 220 L 310 360 L 350 360 L 350 150 L 310 150 L 310 290 L 200 150 Z" fill="white"/>
    </svg>

    <h1>NAVY Browser</h1>
    <p>Le navigateur qui bloque 98% des pubs<br>Installation en 1 clic ⚡</p>

    <a href="#" id="download-btn" class="download-btn">
      ⬇️ Télécharger NAVY
    </a>

    <p class="os-name" id="os-name">Détection de votre système...</p>

    <div class="features">
      <div class="feature">
        <div class="feature-icon">🛡️</div>
        <div class="feature-text">Bloqueur Ultra-Puissant</div>
      </div>
      <div class="feature">
        <div class="feature-icon">🔐</div>
        <div class="feature-text">Mots de passe intégrés</div>
      </div>
      <div class="feature">
        <div class="feature-icon">⚡</div>
        <div class="feature-text">Mode Optimisation</div>
      </div>
    </div>
  </div>

  <script>
    // Détection OS
    function detectOS() {
      const platform = navigator.platform.toLowerCase();
      const userAgent = navigator.userAgent.toLowerCase();
      
      if (platform.includes('win')) return 'windows';
      if (platform.includes('mac')) return 'macos';
      if (platform.includes('linux')) return 'linux';
      if (userAgent.includes('windows')) return 'windows';
      if (userAgent.includes('mac')) return 'macos';
      
      return 'windows'; // Par défaut
    }

    const os = detectOS();
    const downloadBtn = document.getElementById('download-btn');
    const osName = document.getElementById('os-name');

    const downloads = {
      windows: {
        name: 'Windows',
        url: 'https://github.com/lamelow78/NAVY-BROWSER/releases/latest/download/NAVY-Setup-1.0.0.exe'
      },
      macos: {
        name: 'macOS',
        url: 'https://github.com/lamelow78/NAVY-BROWSER/releases/latest/download/NAVY-1.0.0.dmg'
      },
      linux: {
        name: 'Linux',
        url: 'https://github.com/lamelow78/NAVY-BROWSER/releases/latest/download/NAVY-1.0.0.AppImage'
      }
    };

    downloadBtn.href = downloads[os].url;
    osName.textContent = `Pour ${downloads[os].name}`;
  </script>
</body>
</html>
